# First real milestone: reproduce the shape signal on the anchor model, CONFIRMATORY.
# Qwen2.5-7B-Instruct / GSM8K n=300, fp16 (quantization: none) on a cloud GPU (40GB+).
# For a quick offline check on a small local GPU, use configs/smoke-local.yaml (4-bit).
backend: transformers
model:
  name: Qwen/Qwen2.5-7B-Instruct
  quantization: none
dataset:
  name: gsm8k
  split: test
  limit: 300
sampling:
  m: 5
  temperature: 0.7
  max_tokens: 150
segmentation:
  strategy: blank_line
  max_steps: 8
monotonicity:
  eps: 0.01
run:
  seed: 0
  name: qwen7b-gsm8k-300
