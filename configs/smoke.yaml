# First real milestone: reproduce the shape signal on the anchor model.
# Qwen2.5-7B-Instruct / GSM8K n=300. Requires requirements-local.txt + a GPU.
backend: transformers
model:
  name: Qwen/Qwen2.5-7B-Instruct
dataset:
  name: gsm8k
  split: test
  limit: 300
sampling:
  m: 5
  temperature: 0.7
  max_tokens: 150
segmentation:
  strategy: blank_line
  max_steps: 8
monotonicity:
  eps: 0.01
run:
  seed: 0
  name: qwen7b-gsm8k-300
