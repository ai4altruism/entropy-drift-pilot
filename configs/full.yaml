# Panel run template. Duplicate per (model x dataset); run.name must be unique per cell.
# The 4-model panel (see the plan): 3 standard + 1 reasoning-distilled.
#   Qwen/Qwen2.5-7B-Instruct          (anchor, matches Zhao)
#   mistralai/Mistral-7B-Instruct-v0.3 (Zhao cross-model)
#   meta-llama/Llama-3.1-8B-Instruct   (independent standard family)
#   deepseek-ai/DeepSeek-R1-Distill-Qwen-7B  (reasoning-distilled stress-test)
# Datasets: gsm8k (limit 1319 = full) and math500 (limit 500).
backend: transformers
model:
  name: Qwen/Qwen2.5-7B-Instruct
dataset:
  name: gsm8k
  split: test
  limit: 1319
sampling:
  m: 5
  temperature: 0.7
  max_tokens: 150
segmentation:
  # For reasoning-distilled models, also sweep token_window; report sensitivity.
  strategy: blank_line
  window_tokens: 40
  max_steps: 8
monotonicity:
  eps: 0.01
run:
  seed: 0
  name: qwen7b-gsm8k-full
